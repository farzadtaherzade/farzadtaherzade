name: Generate Metrics Card

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: dist/github-metrics.svg
          output_action: commit
          committer_token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          config_timezone: Etc/UTC
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-metrics.svg
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
          else
            git commit -m "chore: update metrics card"
            git pull --rebase --autostash || true
            git push
          fi